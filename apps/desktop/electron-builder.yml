appId: com.garum.desktop
productName: Garum Desktop
copyright: Copyright © 2026 Garum Vinoteca

# Directorio con los archivos compilados
directories:
  output: release
  buildResources: resources

# Archivos a incluir en el empaquetado
files:
  - dist/**/*
  - "!**/*.map"

# Recursos adicionales (icono de bandeja, audio, etc.)
extraResources:
  - from: resources/
    to: .
    filter: ["**/*"]

win:
  target:
    - target: nsis    # Instalador con wizard
      arch: [x64]
  icon: resources/icon.ico
  # Firma de código (opcional — necesita certificado)
  # certificateFile: cert.pfx
  # certificatePassword: ${CERT_PASSWORD}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Garum Desktop
  runAfterFinish: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

# Actualizaciones automáticas (configurar URL del servidor de updates)
# publish:
#   provider: generic
#   url: https://updates.garum.es/desktop
