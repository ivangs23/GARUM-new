name: Desktop Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-win:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        working-directory: apps/desktop
        run: pnpm run gen-icons

      - name: Build renderer/main/preload
        working-directory: apps/desktop
        # electron.vite.config.ts inyecta estas vars en build time vía `define`.
        # Sin ellas, el bundle queda con '' → realtime.ts cae a anon y las
        # policies RLS 014 bloquean el UPDATE de printed_at → no se imprimen
        # tickets en producción. Estos secrets DEBEN existir en el repo:
        #   Settings → Secrets and variables → Actions
        #     VITE_SUPABASE_URL
        #     VITE_SUPABASE_ANON_KEY
        #     VITE_DESKTOP_EMAIL
        #     VITE_DESKTOP_PASSWORD
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DESKTOP_EMAIL: ${{ secrets.VITE_DESKTOP_EMAIL }}
          VITE_DESKTOP_PASSWORD: ${{ secrets.VITE_DESKTOP_PASSWORD }}
        run: pnpm run build

      - name: Package and publish Windows installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win --publish always
